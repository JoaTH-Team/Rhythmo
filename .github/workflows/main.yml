name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            title: Windows
            runs-on: windows-latest
            artifact_path: export/debug/windows/bin
            artifact_name: windowsBuild

          - target: macos
            title: macOS
            runs-on: macos-15
            artifact_path: Rhythmo.tar.gz
            artifact_name: macOSBuild

          - target: linux
            title: Linux
            runs-on: ubuntu-latest
            artifact_path: Rhythmo.tar.gz
            artifact_name: linuxBuild

    name: build${{ matrix.title }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v7

      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Previous Cache
        id: cache-build-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            .haxelib/
            export/debug/${{ matrix.target }}/haxe/
            export/debug/${{ matrix.target }}/obj/
          key: cache-${{ matrix.target }}-debug

      - name: Installing Libraries
        run: haxe --interp -cp ./actions/libs-installer -D analyzer-optimize -main Main

      - name: Compile
        run: |
          haxelib run lime build ${{ matrix.target }} -debug

      - name: Clear Previous Cache
        uses: actions/github-script@v9
        with:
          script: await require('./actions/cache/clear-cache.js')({github, context}, 'cache-${{ matrix.target }}-debug');

      - name: Save Current Cache
        id: cache-build-save
        uses: actions/cache/save@v6
        with:
          path: |
            .haxelib/
            export/debug/${{ matrix.target }}/haxe/
            export/debug/${{ matrix.target }}/obj/
          key: cache-${{ matrix.target }}-debug

      - name: Tar files (macOS/Linux)
        if: matrix.target == 'macos' || matrix.target == 'linux'
        run: tar -zcvf Rhythmo.tar.gz -C export/debug/${{ matrix.target }} bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}